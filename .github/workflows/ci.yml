name: Validar painel

on:
  push:
    branches: [main, master, "v2/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Testes do Radar
        run: npm test
      - name: Build Next.js
        run: npm run build
